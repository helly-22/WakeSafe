# WakeSafe synthetic WHOOP-style data: persona configuration.
#
# SYNTHETIC DATA. Not clinical. Do not use to estimate model accuracy.
#
# Every number below is an ASSUMPTION chosen to look plausible for demos,
# UI work, and tests. None of them is fitted to real data. Tune freely.
# Units: hours (h), beats per minute (bpm), breaths per minute (brpm),
# milliseconds (ms), percent points (pts), degrees Celsius (C).
# "_pct" values are relative percent changes (e.g. -15 means x0.85).
# "_rel_pct" values are relative changes to a share (e.g. sws share x0.80).

calendar:
  start_date: "2026-09-01"     # assumption: first wake date in the output window
  burn_in_nights: 6            # assumption: hidden warm-up nights for AR noise and consistency history
  timezone_offset: "+00:00"    # assumption: every persona lives in UTC so local time equals UTC

noise:
  ar1_phi: 0.5                 # assumption: night-to-night autocorrelation of every noise series
  nightly_sd:                  # assumption: within-person stationary SD of each AR(1) series
    sleep_start_h: 0.35
    in_bed_h: 0.50
    efficiency_pts: 2.5
    sws_share: 0.025
    rem_share: 0.025
    respiratory_rate_brpm: 0.35
    spo2_pts: 0.55
    skin_temp_c: 0.22
    resting_hr_bpm: 2.2
    hrv_log: 0.15              # log-scale SD, about 15 percent night-to-night
    disturbance_log: 0.18
    sleep_need_h: 0.15
    recovery_pts: 7.0          # iid noise added to the recovery formula
    cycle_count: 0.4

missing:
  spo2_night_prob: 0.05        # assumption: SpO2 missing at random on about 5 percent of nights
  skin_temp_night_prob: 0.05   # assumption: skin temp missing at random on about 5 percent of nights
  spo2_sparse_person_prob: 0.10   # assumption: about 10 percent of people have poor SpO2 capture
  spo2_sparse_night_prob: 0.30    # assumption: those people miss SpO2 on about 30 percent of nights
  no_record_night_prob: 0.02   # assumption: whole night missing (no sleep and no recovery record)
  calibrating_nights: [3, 4]   # assumption: user_calibrating true for the first 3 or 4 nights
  no_data_night_prob: 0.15     # assumption: share of nights with some no-data time (strap off, poor fit)
  no_data_fraction: [0.003, 0.04]  # assumption: no-data share of in-bed time on those nights

weekend:
  person_prob: 0.6             # assumption: share of people who shift sleep later on weekends
  start_shift_h: [0.5, 1.5]    # assumption: later sleep start on Fri and Sat nights
  extra_in_bed_h: [0.1, 0.6]   # assumption: extra time in bed on those nights (so wake is later too)

sleep_consistency:
  window_nights: 4             # assumption: consistency compares tonight with the 3 nights before
  pts_per_hour_sd: 40          # assumption: 100 minus 40 points per hour of mean start/end SD

recovery_formula:              # assumption: simple stand-in for WHOOP's proprietary score
  intercept: 62
  hrv_log_weight: 30           # points per log unit of HRV relative to the personal baseline
  rhr_weight: -1.2             # points per bpm above the personal baseline
  performance_weight: 0.35     # points per performance point above performance_ref
  performance_ref: 85

confounder_nights:             # alcohol or minor illness, applies to EVERY person (shared confounder)
  prob_weekday: 0.05           # assumption
  prob_weekend: 0.15           # assumption: more likely on Fri and Sat nights
  effects:
    hrv_pct: -15
    resting_hr_bpm: 3.5
    spo2_pts: -0.4
    respiratory_rate_brpm: 0.3
    disturbance_pct: 20
    efficiency_pts: -2.5
    rem_share_rel_pct: -12
    skin_temp_c: 0.1

episode_tail: [0.5, 0.2]       # assumption: recovery tail after any episode, as a fraction of peak effect

# ---------------------------------------------------------------------------
# Healthy-style baseline. Every persona starts here, then effects are applied.
# ---------------------------------------------------------------------------
healthy:
  age: [20, 70]                # assumption: uniform adult age range
  male_prob: 0.5               # assumption
  height_m:
    male: {mean: 1.76, sd: 0.07}
    female: {mean: 1.63, sd: 0.065}
  bmi: {mean: 24.3, sd: 2.9, min: 17.5, max: 34.0}   # assumption: mostly 19 to 29
  neck_cm:                     # neck = base + per_bmi * (bmi - 24) + noise
    male: {base: 37.5, per_bmi: 0.55, sd: 1.5}
    female: {base: 33.0, per_bmi: 0.45, sd: 1.3}
  profile_probs:               # assumption: background rates in a healthy-looking cohort
    snoring: 0.20
    daytime_tiredness: 0.20
    witnessed_breathing_pauses: 0.03
    hypertension: 0.12
    type2_diabetes: 0.04
    atrial_fibrillation: 0.01
    asthma: 0.06
  baselines:                   # between-person distributions of personal baselines
    resting_hr_bpm: {mean: 61.0, sd: 5.0, per_bmi: 0.2, min: 42, max: 85}
    hrv_ms: {at_age_20: 68.0, log_per_year: -0.017, log_sd: 0.25, min: 12, max: 180}
    spo2_pts: {mean: 96.6, sd: 0.95, min: 93.5, max: 99.0}
    respiratory_rate_brpm: {mean: 14.8, sd: 1.0, per_bmi: 0.05, min: 11.0, max: 19.0}
    skin_temp_c: {mean: 33.9, sd: 0.45, min: 32.5, max: 35.3}
    in_bed_h: {mean: 7.75, sd: 0.45, min: 6.5, max: 9.0}
    sleep_start_h: {mean: -0.8, sd: 0.75, min: -3.0, max: 1.5}   # hours relative to midnight before wake date
    efficiency_pts: {mean: 91.0, sd: 3.5, min: 80.0, max: 97.0}
    sws_share: {mean_at_20: 0.21, per_year: -0.0012, sd: 0.03, min: 0.08, max: 0.32}
    rem_share: {mean: 0.23, sd: 0.025, min: 0.15, max: 0.30}
    disturbances: {median: 9.5, log_sd: 0.35, min: 3, max: 25, nightly_max: 90}   # person baseline clipped; nightly count capped
    sleep_need_h: {mean: 7.9, sd: 0.4, min: 6.8, max: 9.2}
    cycle_length_h: [1.4, 1.7]

# ---------------------------------------------------------------------------
# Sleep apnea pattern. Effects are relative to each person's own baseline.
# Mild is about 40 percent of moderate, severe about 170 percent.
# ---------------------------------------------------------------------------
osa:
  severity_mix: {mild: 0.35, moderate: 0.35, severe: 0.30}   # assumption: share of the --n-osa cohort
  individual_effect_scale: {mean: 1.0, sd: 0.35, min: 0.35, max: 1.8}  # assumption: person-level heterogeneity
  simulated_ahi:               # events per hour, drawn uniformly per person
    mild: [5, 14]
    moderate: [15, 29]
    severe: [30, 60]
  effects:
    mild:
      spo2_pts: -0.5
      spo2_sd_mult: 1.3
      spo2_dip_night_prob: 0.05    # occasional much lower nights
      spo2_dip_pts: [1.5, 3.0]
      respiratory_rate_brpm: 0.3
      respiratory_rate_sd_mult: 1.15
      disturbance_pct: 25
      efficiency_pts: -2
      sws_share_rel_pct: -10
      rem_share_rel_pct: -5
      resting_hr_bpm: 1.5
      hrv_pct: -8
    moderate:
      spo2_pts: -1.2
      spo2_sd_mult: 1.6
      spo2_dip_night_prob: 0.10
      spo2_dip_pts: [2.0, 4.0]
      respiratory_rate_brpm: 0.7
      respiratory_rate_sd_mult: 1.3
      disturbance_pct: 60
      efficiency_pts: -5
      sws_share_rel_pct: -20
      rem_share_rel_pct: -10
      resting_hr_bpm: 3.0
      hrv_pct: -15
    severe:
      spo2_pts: -2.2
      spo2_sd_mult: 2.0
      spo2_dip_night_prob: 0.18
      spo2_dip_pts: [2.5, 5.0]
      respiratory_rate_brpm: 1.2
      respiratory_rate_sd_mult: 1.5
      disturbance_pct: 110
      efficiency_pts: -9
      sws_share_rel_pct: -30
      rem_share_rel_pct: -15
      resting_hr_bpm: 5.0
      hrv_pct: -25
  profile:                     # correlations: more likely, never guaranteed
    age: {mean: 50, sd: 11, min: 25, max: 78}
    age_shift: {mild: 0, moderate: 3, severe: 5}
    male_prob: 0.68
    bmi:
      mild: {mean: 28.5, sd: 3.5}
      moderate: {mean: 30.5, sd: 4.0}
      severe: {mean: 33.0, sd: 4.5}
      min: 20.0
      max: 45.0
    normal_bmi_prob: 0.15      # some apnea personas draw BMI from the healthy distribution
    extra_neck_cm: 1.0
    probs:
      mild: {snoring: 0.60, daytime_tiredness: 0.40, witnessed_breathing_pauses: 0.20, hypertension: 0.30, type2_diabetes: 0.12, atrial_fibrillation: 0.03}
      moderate: {snoring: 0.75, daytime_tiredness: 0.55, witnessed_breathing_pauses: 0.35, hypertension: 0.40, type2_diabetes: 0.15, atrial_fibrillation: 0.05}
      severe: {snoring: 0.85, daytime_tiredness: 0.70, witnessed_breathing_pauses: 0.55, hypertension: 0.55, type2_diabetes: 0.22, atrial_fibrillation: 0.08}

# ---------------------------------------------------------------------------
# Hard positives: apnea pattern that is subtle and overlaps healthy ranges.
# ---------------------------------------------------------------------------
hard_positive:
  severity: mild
  effect_scale: 0.5            # assumption: half of the usual mild effect
  individual_scale_max: 1.0    # assumption: person-level heterogeneity never pushes past 0.5 x mild
  simulated_ahi: [5, 12]
  age: {mean: 45, sd: 10, min: 25, max: 70}
  male_prob: 0.5
  use_healthy_bmi: true        # normal BMI
  probs: {snoring: 0.0, daytime_tiredness: 0.40, witnessed_breathing_pauses: 0.0, hypertension: 0.15, type2_diabetes: 0.04, atrial_fibrillation: 0.01}

# ---------------------------------------------------------------------------
# Hard negatives: healthy people whose data looks suspicious.
# Subtypes are assigned in this order, cycling if --n-hard-negative is larger.
# ---------------------------------------------------------------------------
hard_negative:
  subtypes: [short_sleeper, endurance_trainer, frequent_alcohol, cold, high_bmi]
  short_sleeper:
    in_bed_h: {mean: 6.0, sd: 0.3}
    chronic: {resting_hr_bpm: 2.0, hrv_pct: -10, efficiency_pts: 1.5}
  endurance_trainer:
    resting_hr_bpm: {mean: 48, sd: 3}
    hrv_mult: 1.5              # higher personal HRV baseline
    extra_sleep_need_h: 0.6
    chronic: {disturbance_pct: 20, respiratory_rate_brpm: 0.4}
    hard_training_night_prob: 0.35
    hard_training_effects: {resting_hr_bpm: 5.0, hrv_pct: -22, respiratory_rate_brpm: 0.5, disturbance_pct: 25, efficiency_pts: -2.0}
  frequent_alcohol:
    prob_weekday: 0.30
    prob_weekend: 0.60
    effect_scale: 1.5          # heavier drinking nights than the shared confounder
  cold:
    duration_nights: [3, 4]
    effects: {respiratory_rate_brpm: 1.2, spo2_pts: -1.2, skin_temp_c: 0.4, resting_hr_bpm: 4.0, hrv_pct: -20, disturbance_pct: 40, efficiency_pts: -4.0}
  high_bmi:
    bmi: [31.0, 37.0]
    probs: {snoring: 0.45, daytime_tiredness: 0.25, witnessed_breathing_pauses: 0.05, hypertension: 0.25, type2_diabetes: 0.10}
    chronic: {resting_hr_bpm: 3.0, hrv_pct: -10, spo2_pts: -0.5, respiratory_rate_brpm: 0.5, disturbance_pct: 10}

# ---------------------------------------------------------------------------
# Other risk personas for the multi-condition engine.
# Assigned in this order, cycling if --n-other is larger.
# ---------------------------------------------------------------------------
other:
  personas: [cardiovascular_strain, respiratory_flare, acute_illness, urgent]
  age: {mean: 55, sd: 10, min: 35, max: 78}
  bmi_shift: 2.0               # slightly higher BMI than the healthy cohort
  cardiovascular_strain:
    hypertension_prob: 0.7     # otherwise atrial fibrillation; afib_also_prob adds both
    afib_also_prob: 0.25
    drift_nights: [14, 21]     # linear drift that ends on the last night
    effects_at_end: {resting_hr_bpm: 6.0, hrv_pct: -25, respiratory_rate_brpm: 0.6}
  respiratory_flare:
    asthma_prob: 0.6           # otherwise copd
    duration_nights: [3, 5]
    effects: {respiratory_rate_brpm: 2.0, skin_temp_c: 0.4, spo2_pts: -2.0, hrv_pct: -15, resting_hr_bpm: 3.0, disturbance_pct: 40, efficiency_pts: -4.0}
  acute_illness:
    duration_nights: [3, 4]
    effects: {skin_temp_c: 1.0, resting_hr_bpm: 7.0, respiratory_rate_brpm: 1.5, hrv_pct: -30, spo2_pts: -0.8, disturbance_pct: 35, efficiency_pts: -5.0}
  urgent:
    underlying: [healthy, osa_moderate, cardiovascular_strain, acute_illness]
    red_flags: [chest_pain, fainting, severe_shortness_of_breath, stroke_symptoms]
    two_flags_prob: 0.3

# ---------------------------------------------------------------------------
# Output and validation settings.
# ---------------------------------------------------------------------------
whoop_mock:
  page_size: 25                # WHOOP v2 collection limit is at most 25
  user_id_base: 900000         # fake numeric user ids, not real accounts

validation:
  auroc_min: 0.55              # each core feature must separate better than this
  auroc_max: 0.90              # and worse than this (target band)
  auroc_hard_fail: 0.95        # flagged as unrealistically easy
  hard_negative_window_nights: 4          # worst consecutive-night window compared with mild apnea
  hard_positive_healthy_quantile: 0.90    # "healthy-like" means not more apnea-like than this healthy quantile
  hard_positive_min_healthy_features: 3   # of 6 core features that must be healthy-like
  ranges:                      # physiologically plausible ranges (inclusive)
    recovery_score: [0, 100]
    resting_heart_rate: [35, 110]
    hrv_rmssd_milli: [5, 250]
    spo2_percentage: [85, 100]
    skin_temp_celsius: [30, 38]
    respiratory_rate: [8, 30]
    total_in_bed_time_milli: [10800000, 43200000]   # 3 h to 12 h
    sleep_efficiency_percentage: [50, 100]
    sleep_performance_percentage: [0, 100]
    sleep_consistency_percentage: [0, 100]
    disturbance_count: [0, 100]
    sleep_cycle_count: [0, 10]
    age: [18, 90]
    bmi: [15, 60]
    height_m: [1.40, 2.10]
    weight_kg: [35, 200]
    neck_circumference_cm: [25, 55]
